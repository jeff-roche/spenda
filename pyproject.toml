[project]
name = "spenda"
version = "0.1.0"
description = "Local usage and cost analytics for coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "uvicorn>=0.35",
]

[project.scripts]
spenda = "spenda.cli:main"

[project.urls]
Repository = "https://github.com/sshnaidm/spenda"
Issues = "https://github.com/sshnaidm/spenda/issues"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.4", "pytest-cov>=6.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spenda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
