<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  {% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
  <title>{% block title %}Codex usage{% endblock %}</title>
  <script>
    const savedTheme = localStorage.getItem('codex-dashboard-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
  </script>
  <style>
    :root { color-scheme: light dark; --bg:#f2f0eb; --panel:#fbfaf7; --panel-2:#ece9e2; --ink:#292825; --muted:#716f69; --line:#d5d0c6; --accent:#745b3b; --warn:#9b4f37; --astra:#865f78; --sol:#ad7b38; --terra:#527765; --luna:#56758d; --other:#7b7770; }
    :root[data-theme="dark"] { color-scheme:dark;--bg:#090d12;--panel:#151b22;--panel-2:#222b35;--ink:#f4f7fa;--muted:#bdc7d3;--line:#4b5968;--accent:#8fc5ff;--warn:#ff9b78;--astra:#efa6d3;--sol:#ffc06b;--terra:#78d9a4;--luna:#7dccf4;--other:#c7d0d9; }
    :root[data-theme="light"] { color-scheme:light; }
    @media (prefers-color-scheme:dark) { :root:not([data-theme]) { --bg:#090d12;--panel:#151b22;--panel-2:#222b35;--ink:#f4f7fa;--muted:#bdc7d3;--line:#4b5968;--accent:#8fc5ff;--warn:#ff9b78;--astra:#efa6d3;--sol:#ffc06b;--terra:#78d9a4;--luna:#7dccf4;--other:#c7d0d9; } }
    * { box-sizing:border-box; } body { margin:0; font:14px/1.45 ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    header { background:color-mix(in srgb,var(--panel) 96%,var(--bg)); border-bottom:1px solid var(--line); } nav { max-width:1500px; margin:auto; display:flex; align-items:center;gap:6px;padding:10px 18px; }
    nav strong { margin-right:20px;font-size:16px;letter-spacing:-.01em; } nav a { color:var(--muted);text-decoration:none;padding:6px 9px;border-radius:4px; } nav a.active,nav a:hover { color:var(--ink);background:var(--panel-2); }
    .theme-toggle { margin-left:auto;padding:4px 8px;min-width:34px;font-size:15px;line-height:1.2; }
    main { max-width:1500px; margin:0 auto; padding:18px; } h1 { font-size:24px;font-weight:750;margin:0 0 14px; } h2 { font-size:17px;font-weight:750;margin:24px 0 8px; } h3 {font-size:14px;font-weight:700;margin:0 0 5px;color:var(--muted)}
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:8px; } .card,.panel { background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px; }
    .metric { font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap; } .muted {color:var(--muted)} .warning { color:var(--warn);font-weight:700; } .astra {color:var(--astra);font-weight:700}
    .periods { display:flex;gap:5px;margin:0 0 12px; } .periods a,.button,button { border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 9px;border-radius:4px;text-decoration:none;cursor:pointer; } .periods a.selected {border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
    .table-wrap { overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:5px; } table { border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums; } th,td { border-bottom:1px solid var(--line);padding:7px 9px;text-align:right;white-space:nowrap;vertical-align:top; } th {position:sticky;top:0;background:var(--panel-2);color:var(--ink);font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.055em} th:first-child,td:first-child,th.left,td.left{text-align:left} tbody tr:hover{background:color-mix(in srgb,var(--accent) 11%,transparent)} tbody tr:last-child td{border-bottom:0} td.wrap{white-space:normal;min-width:250px;text-align:left}
    a {color:var(--accent)} .sort-link{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;color:inherit;text-decoration:none}.left .sort-link{justify-content:flex-start}.sort-link:hover{color:var(--accent)} code{font-size:12px} form.filters {display:flex;flex-wrap:wrap;align-items:end;gap:8px;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:7px;margin-bottom:12px} label{display:grid;gap:3px;color:var(--muted);font-size:12px} input,select{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px;border-radius:4px;max-width:220px}.inline{display:inline-flex;align-items:center;gap:4px}.inline input{width:auto}
    .chart svg {width:100%;height:190px;background:var(--panel);border:1px solid var(--line);border-radius:6px}.trend-line{fill:none;stroke:var(--accent);stroke-width:2}.axis{stroke:var(--line)}svg text{fill:var(--muted);font-size:11px}
    .composition-grid{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:10px}.composition-card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:13px}.composition-heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}.composition-heading h3{margin:0}.composition-heading strong{font-size:16px;font-weight:750;font-variant-numeric:tabular-nums}.stacked-bar{display:flex;height:19px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);border-radius:3px}.segment{display:block;flex-basis:0;min-width:3px}.segment+ .segment{border-left:2px solid var(--panel)}.composition-legend{display:grid;gap:5px;margin-top:10px}.composition-legend>div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:7px;font-size:12px}.composition-legend strong{font-weight:750;font-variant-numeric:tabular-nums}.legend-model{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.swatch{width:9px;height:9px;border-radius:2px}.model-sol{background:var(--sol)}.model-terra{background:var(--terra)}.model-luna{background:var(--luna)}.model-astra{background:var(--astra)}.model-other{background:var(--other)}.model-sol-text{color:var(--sol)}.model-terra-text{color:var(--terra)}.model-luna-text{color:var(--luna)}.model-astra-text{color:var(--astra)}.model-other-text{color:var(--other)}.model-name{font-weight:700}.call-identity summary{cursor:pointer;color:var(--accent);font-weight:650;list-style:none}.call-identity summary::-webkit-details-marker{display:none}.call-identity[open] summary{margin-bottom:5px}.call-identity code{display:block;max-width:430px;white-space:normal;overflow-wrap:anywhere;color:var(--muted)}
    .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.tag{background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:9px}.right{float:right}.exact{font-family:ui-monospace,monospace;font-size:12px}.unknown{color:var(--warn)}
    @media (max-width:900px){.composition-grid{grid-template-columns:1fr}.composition-card{min-width:0}}
  </style>
</head>
<body>
<header><nav><strong>Codex usage</strong><a class="{{ 'active' if active=='home' }}" href="/">Overview</a><a class="{{ 'active' if active=='sessions' }}" href="/sessions">Sessions</a><a class="{{ 'active' if active=='models' }}" href="/models">Models</a><a class="{{ 'active' if active=='projects' }}" href="/projects">Projects</a><a class="{{ 'active' if active=='trends' }}" href="/trends">Trends</a><a class="{{ 'active' if active=='compare' }}" href="/compare">Compare</a><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme"></button></nav></header>
<main>{% block content %}{% endblock %}</main>
<script>
  const themeToggle = document.getElementById('theme-toggle');
  const activeTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const updateThemeToggle = () => {
    const dark = activeTheme() === 'dark';
    themeToggle.textContent = dark ? '☀' : '☾';
    themeToggle.title = themeToggle.ariaLabel = `Switch to ${dark ? 'light' : 'dark'} theme`;
  };
  themeToggle.addEventListener('click', () => {
    const theme = activeTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    localStorage.setItem('codex-dashboard-theme', theme);
    updateThemeToggle();
  });
  updateThemeToggle();
</script>
</body>
</html>
